# AC-94.6. CI's actions are pinned to commits; this proposes the next pin
# each week as a pull request, which CI checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # AC-102.9. Minor and patch updates arrive as one weekly pull request. A
  # major version changes how the code is written, so it gets its own story.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
