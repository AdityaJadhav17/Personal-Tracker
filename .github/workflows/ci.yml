name: CI

on:
  push:
  pull_request:

# AC-83.7. CI only reads the code, so its token can only read. CodeQL's first
# scan, 1 October 2026, flagged the default, which can also write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # AC-94.6. Pinned to the commit, since a tag can be moved to other code;
      # Dependabot proposes the next pin (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # AC-94.7. No package's install script runs; the build and tests pass
      # without them (only esbuild has one, and its binary comes as a package).
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
